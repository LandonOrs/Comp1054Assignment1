<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Website Images</title>
  <style>
    body {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Scenario 1: Restaurant Website</h1>
  <main class="images">
    <figure>
      <img src="Scenario 1 Restaurant Website  .jpeg" alt="Restaurant website sitemap">
      <figcaption>Restaurant website sitemap</figcaption>
    </figure>
    <figure>
      <img src="Scenario1-Resturant.jpg" alt="Restaurant website design mockup">
      <figcaption>Restaurant website wireframe</figcaption>
    </figure>
  </main>
</body>
</html>
